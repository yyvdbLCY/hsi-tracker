<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恒指與牛熊街貨比率背馳互動觀測圖表 (深色專業版 V3.4)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a202c; color: #e2e8f0; margin: 0; padding: 12px;
        }
        .container {
            max-width: 1200px; margin: 0 auto; background: #2d3748; padding: 15px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: relative;
        }
        h1 { color: #f7fafc; text-align: center; margin-bottom: 5px; font-size: 20px; }
        .subtitle { color: #a0aec0; text-align: center; margin-bottom: 20px; font-size: 13px; }
        .chart-container {
            position: relative; height: 380px; width: 100%; margin-bottom: 20px;
            background: #1e293b; border-radius: 8px; padding: 10px 5px 5px 5px;
        }
        .badge-neutral { background: #4a5568; color: white; }
        .badge-warn { background: #e53e3e; color: white; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        }
        .data-panel { background: #1e293b; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #4a5568; }
        .panel-title { font-size: 15px; font-weight: bold; color: #90cdf4; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        table { width: 100%; border-collapse: collapse; background: #2d3748; border-radius: 6px; overflow: hidden; font-size: 13px; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #4a5568; color: #e2e8f0; }
        th { background-color: #4a5568; color: white; font-size: 13px; font-weight: 600; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .btn-refresh { background-color: #4a5568; color: white; font-size: 12px; padding: 4px 8px; }
        .btn-refresh:hover { background-color: #2d3748; }
        .badge { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-weight: bold; color: white; margin-top: 3px; }
        .badge-overheat { background-color: #e53e3e; }
        .badge-killbull { background-color: #d69e2e; color: #1a202c; }
        .badge-freeze { background-color: #3182ce; }
        .badge-killbear { background-color: #805ad5; }
        .loading-mask { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:10; font-size: 15px; font-weight:bold; color:#90cdf4; display:none; border-radius: 12px; }
        .date-cell-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slider-container { display: flex; align-items: center; justify-content: center; margin: 10px 0 20px; gap: 10px; color: #a0aec0; font-size: 13px; }

        /* ===== HSI 期權 OI 牆位 ===== */
        .oi-summary { padding: 8px 0 14px; }
        .oi-summary-row { display: flex; align-items: center; gap: 8px; }
        .oi-label { font-weight: bold; font-size: 13px; min-width: 64px; text-align: center; }
        .oi-call { color: #fc8181; }
        .oi-put { color: #68d391; }
        .oi-bar-track { flex: 1; height: 22px; background: #1a202c; border-radius: 4px; position: relative; overflow: hidden; border: 1px solid #2d3748; }
        .oi-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
        .oi-bar-call { background: linear-gradient(90deg, rgba(252,129,129,0.45) 0%, #c53030 100%); }
        .oi-bar-put { background: linear-gradient(90deg, #2f855a 0%, rgba(104,211,145,0.45) 100%); }
        .oi-pct { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
        .oi-pct-left { right: auto; left: 8px; }
        .oi-divider { color: #4a5568; font-weight: bold; padding: 0 2px; }

        .oi-table { width: 100%; border-collapse: collapse; background: #2d3748; border-radius: 6px; overflow: hidden; font-size: 12px; margin-top: 6px; }
        .oi-table th { background: #4a5568; color: white; padding: 8px 4px; font-size: 12px; font-weight: 600; }
        .oi-table td { padding: 0; text-align: center; border-bottom: 1px solid #4a5568; color: #e2e8f0; height: 26px; }
        .oi-row-heavy td { background: rgba(229, 62, 62, 0.12); }
        .oi-row-near td { border-top: 2px solid #48bb78; border-bottom: 2px solid #48bb78; }
        .oi-row-near td:first-child { border-left: 2px solid #48bb78; }
        .oi-row-near td:last-child { border-right: 2px solid #48bb78; }
        .oi-row-hidden { display: none; }
        .oi-col-pct { width: 11%; }
        .oi-col-strike { width: 22%; font-weight: bold; color: #90cdf4; font-size: 13px; }
        .oi-cell-bar-wrap { position: relative; height: 100%; min-height: 26px; }
        .oi-cell-bar-call { position: absolute; right: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(252,129,129,0.35) 0%, #c53030 100%); border-radius: 2px; }
        .oi-cell-bar-put { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #2f855a 0%, rgba(104,211,145,0.35) 100%); border-radius: 2px; }
        .oi-cell-text-call { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.7); white-space: nowrap; }
        .oi-cell-text-put { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.7); white-space: nowrap; }
        .oi-cell-pct { font-size: 12px; }
        .oi-flag { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; margin-left: 3px; color: white; }
        .oi-flag-heavy { background: #e53e3e; }
        .oi-flag-most { background: #d69e2e; color: #1a202c; }
        .oi-update-time { font-size: 12px; color: #a0aec0; font-weight: normal; }
        .slider-container input[type=range] { width: 200px; accent-color: #90cdf4; }
        @media (max-width: 600px) {
            body { padding: 8px; } h1 { font-size: 18px; } .chart-container { height: 300px; }
            .col-bear { display: none; } th, td { padding: 6px 4px; font-size: 12px; }
        }
        @media (min-width: 601px) {
            .container { padding: 30px; } h1 { font-size: 26px; } .subtitle { font-size: 14px; }
            .chart-container { height: 520px; } .data-panel { padding: 20px; }
            .panel-title { font-size: 18px; margin-bottom: 15px; } .btn-refresh { font-size: 14px; padding: 8px 16px; }
            th, td { padding: 10px 12px; font-size: 14px; }
            .badge { font-size: 11px; margin-top: 0; margin-left: 5px; }
            .date-cell-container { flex-direction: row; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="loadingMask" class="loading-mask">🔄 正在與 Firebase 雲端同步...</div>
    <h1>📊 恆指牛熊街貨量化觀測系統V3.4</h1>
    <div id="nextGannDisplay" style="text-align: right; font-size: 13px; color: #90cdf4; font-weight: bold; margin-bottom: 8px; padding-right: 5px;">🌌 下個江恩窗口: --</div>
    <div class="chart-container"><canvas id="interactiveChart"></canvas></div>
    <div id="divergenceBadges" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 8px 0 4px; padding: 6px; background: rgba(45, 55, 72, 0.6); border-radius: 6px; font-size: 12px;">
        <span id="bullDivBadge" style="padding: 4px 10px; background: #4a5568; color: white; border-radius: 4px;">🐂 牛證背馳: <strong>--</strong></span>
        <span id="bearDivBadge" style="padding: 4px 10px; background: #4a5568; color: white; border-radius: 4px;">🐻 熊證背馳: <strong>--</strong></span>
        <span id="hsiChgBadge" style="padding: 4px 10px; background: #4a5568; color: white; border-radius: 4px;">📉 HSI 日變: <strong>--</strong></span>
        <span id="expandingBadge" style="padding: 4px 10px; background: #e53e3e; color: white; font-weight: bold; border-radius: 4px; animation: pulse 1.5s infinite; display: none;">⚡ 連續擴大</span>
    </div>
    <div class="slider-container">
        <span>📅 顯示最近</span>
        <input type="range" id="dayRangeSlider" min="7" max="999" value="30" oninput="window.updateDayRange(this.value)">
        <span id="dayRangeLabel">30</span>
        <span>天</span>
    </div>
    <div class="chart-container" style="height: 140px; margin-top: 8px;">
        <canvas id="divergenceChart"></canvas>
    </div>
    <div class="data-panel">
        <div class="panel-title">
            <span>📋 歷史數據</span>
            <button class="btn btn-refresh" id="refreshBtn">🔄 刷新數據</button>
        </div>
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 35%;">日期</th>
                    <th style="width: 30%;">恒指收市價</th>
                    <th style="width: 25%;">牛證比例</th>
                    <th style="width: 10%;" class="col-bear">熊證比例</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <button id="toggleTableBtn" class="btn" style="width: 100%; margin-top: 12px; background-color: #4a5568; color: white; padding: 8px;">🔽 展開全部歷史數據</button>
    </div>

    <div class="data-panel" style="margin-top: 18px;">
        <div class="panel-title">
            <span>📊 HSI 即月期權 OI 牆位</span>
            <span class="oi-update-time" id="oiUpdateTime">--</span>
        </div>
        <div class="oi-summary">
            <div class="oi-summary-row">
                <span class="oi-label oi-call">認購街貨</span>
                <div class="oi-bar-track">
                    <div class="oi-bar-fill oi-bar-call" id="oiCallBar" style="width: 0%;"></div>
                    <span class="oi-pct" id="oiCallPct">--%</span>
                </div>
                <span class="oi-divider">|</span>
                <div class="oi-bar-track">
                    <div class="oi-bar-fill oi-bar-put" id="oiPutBar" style="width: 0%;"></div>
                    <span class="oi-pct oi-pct-left" id="oiPutPct">--%</span>
                </div>
                <span class="oi-label oi-put">認沽街貨</span>
            </div>
            <div style="text-align: center; margin-top: 10px; font-size: 12px; color: #a0aec0;">
                📍 上日收市: <span id="oiLastClose" style="color: #f7fafc; font-weight: bold;">--</span>
                <span id="oiStrikeCount" style="margin-left: 12px; color: #718096;"></span>
            </div>
            <div id="oiEdgeWarning" style="display:none; margin: 8px 0; padding: 8px 12px; background: rgba(245, 101, 101, 0.15); border-left: 3px solid #f56565; color: #fc8181; font-size: 12px; border-radius: 4px;"></div>
            <div style="text-align: center; margin: 6px 0 10px; font-size: 12px;">
                <button id="oiToggleBtn" style="background: rgba(99, 179, 237, 0.15); border: 1px solid #63b3ed; color: #63b3ed; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">📖 展開全部</button>
            </div>
        </div>
        <table class="oi-table">
            <thead>
                <tr>
                    <th class="oi-col-pct">Call%</th>
                    <th>Call OI [Δ]</th>
                    <th class="oi-col-strike">行使價</th>
                    <th>Put OI [Δ]</th>
                    <th class="oi-col-pct">Put%</th>
                </tr>
            </thead>
            <tbody id="oiTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    window.marketData = [];
    window.chartInstance = null;
    window.isTableExpanded = false;
    window.displayDays = 30;

    const firebaseConfig = {
        apiKey: "AIzaSyAPuQf_rtonxZ6DxGOEuk_WLLLC6hgDdfI",
        authDomain: "bull-bear-ratio-record.firebaseapp.com",
        projectId: "bull-bear-ratio-record",
        storageBucket: "bull-bear-ratio-record.firebasestorage.app",
        messagingSenderId: "49946190061",
        appId: "1:49946190061:web:867765d5eb918f83b62ce4",
        measurementId: "G-XE69HF005H"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("market").doc("hsi_data");

    const defaultData = [
        { date: "2026-05-11", hsi: 26406.84, bull: 65.9, bull_amount: null, bear_amount: null },
        { date: "2026-05-12", hsi: 26347.91, bull: 67.3, bull_amount: null, bear_amount: null },
        { date: "2026-05-13", hsi: 26388.44, bull: 70.8, bull_amount: null, bear_amount: null },
        { date: "2026-05-14", hsi: 26389.04, bull: 75.4, bull_amount: 17106, bear_amount: 5593 },
        { date: "2026-05-15", hsi: 25962.73, bull: 73.1, bull_amount: 14776, bear_amount: 5433 },
        { date: "2026-05-18", hsi: 25675.18, bull: 69.6, bull_amount: 12702, bear_amount: 5550 },
        { date: "2026-05-19", hsi: 25797.85, bull: 66.2, bull_amount: 12152, bear_amount: 6198 },
        { date: "2026-05-20", hsi: 25651.22, bull: 67.1, bull_amount: 12770, bear_amount: 6266 },
        { date: "2026-05-21", hsi: 25386.52, bull: 66.8, bull_amount: 12771, bear_amount: 6350 },
        { date: "2026-05-22", hsi: 25606.03, bull: 61.3, bull_amount: 11465, bear_amount: 7229 },
        { date: "2026-05-26", hsi: 25599.45, bull: 56.7, bull_amount: 9300, bear_amount: 7107, bull_500_amount: 3200, bear_500_amount: 1850 },
        { date: "2026-05-27", hsi: 25328.23, bull: 65.8, bull_amount: 12974, bear_amount: 6731, bull_500_amount: 4100, bear_500_amount: 1620 },
        { date: "2026-05-28", hsi: 25006.16, bull: 64.1, bull_amount: 12169, bear_amount: 6826, bull_500_amount: 3680, bear_500_amount: 2050 },
        { date: "2026-05-29", hsi: 25182.39, bull: 56.2, bull_amount: 10498, bear_amount: 8195, bull_500_amount: 2004, bear_500_amount: 3120 },
        { date: "2026-06-01", hsi: 25398.18, bull: 52.2, bull_amount: 8223, bear_amount: 7516, bull_500_amount: 415, bear_500_amount: 3880 },
        { date: "2026-06-02", hsi: 26038.32, bull: 46.0, bull_amount: 7571, bear_amount: 8892, bull_500_amount: 0, bear_500_amount: 4250 },
        { date: "2026-06-03", hsi: 25633.21, bull: 58.4, bull_amount: 9103, bear_amount: 6481, bull_500_amount: 2235, bear_500_amount: 2580 },
        { date: "2026-06-04", hsi: 25253.4, bull: 60.9, bull_amount: 10874, bear_amount: 6989, bull_500_amount: 3423, bear_500_amount: 2120 },
        { date: "2026-06-05", hsi: 24961.95, bull: 60.1, bull_amount: 10878, bear_amount: 7208, bull_500_amount: 4574, bear_500_amount: 1880 },
        { date: "2026-06-08", hsi: 24657.06, bull: 56.8, bull_amount: 7308, bear_amount: 5548, bull_500_amount: 2552, bear_500_amount: 2340 },
        { date: "2026-06-09", hsi: 24565.9, bull: 58.1, bull_amount: 10331, bear_amount: 7458, bull_500_amount: 5127, bear_500_amount: 1380 },
        { date: "2026-06-10", hsi: 24407.96, bull: 57.2, bull_amount: 9766, bear_amount: 7318, bull_500_amount: 4012, bear_500_amount: 1950 },
        { date: "2026-06-11", hsi: 24249.29, bull: 55.9, bull_amount: 8996, bear_amount: 7091, bull_500_amount: 3152, bear_500_amount: 2880 },
        { date: "2026-06-12", hsi: 24718.1, bull: 52.4, bull_amount: 8174, bear_amount: 7435, bull_500_amount: 427, bear_500_amount: 3650 }
    ];

    window.getMarketStatus = function(index) {
        if (index < 0 || index >= window.marketData.length) return { text: "", badgeHTML: "" };
        const current = window.marketData[index];
        const prev = index > 0 ? window.marketData[index - 1] : null;
        if (!current || typeof current.bull !== 'number') return { text: "", badgeHTML: "" };
        if (current.bull >= 70) return { text: " (過熱)", badgeHTML: `<span class="badge badge-overheat">🔥過熱</span>` };
        if (current.bull_500_amount >= 3500) return { text: " (近距殺牛)", badgeHTML: `<span class="badge badge-killbull">⚡近距殺牛</span>` };
        if (current.bear_500_amount >= 3000) return { text: " (近距殺熊)", badgeHTML: `<span class="badge badge-killbear">⚡近距殺熊</span>` };
        if (current.bull <= 30) return { text: " (過冷)", badgeHTML: `<span class="badge badge-freeze">❄️過冷</span>` };
        if (prev && typeof prev.bull === 'number' && prev.bull <= 35 && (current.bull - prev.bull) >= 1.5) return { text: " (殺熊)", badgeHTML: `<span class="badge badge-killbear">💥殺熊</span>` };
        return { text: "", badgeHTML: "" };
    };

    const getPointEmoji = (context) => {
        const localIndex = context.dataIndex;
        const globalIndex = (window.chartInstance && window.chartInstance.globalIndices)
            ? window.chartInstance.globalIndices[localIndex]
            : localIndex;
        const status = window.getMarketStatus(globalIndex);
        if (status.text.includes("過熱")) return "🔥";
        if (status.text.includes("殺牛")) return "⚡";
        if (status.text.includes("過冷")) return "❄️";
        if (status.text.includes("殺熊")) return "💥";
        return "";
    };

    const isGannWindow = (dateStr) => {
        if (!dateStr || !dateStr.includes("-")) return false;
        const parts = dateStr.split('-');
        if (parts.length < 3) return false;
        const md = `${parts[1]}-${parts[2]}`;
        const specialDays = ["03-21", "05-15", "06-21", "07-23", "09-21", "11-15", "12-21"];
        return specialDays.includes(md);
    };

    const isGannDay = (context) => {
        const localIndex = context.dataIndex;
        const globalIndex = (window.chartInstance && window.chartInstance.globalIndices)
            ? window.chartInstance.globalIndices[localIndex]
            : localIndex;
        if (!window.marketData || !window.marketData[globalIndex]) return "";
        return isGannWindow(window.marketData[globalIndex].date) ? "🌌" : "";
    };

    function updateNextGannDisplay() {
        if (!window.marketData || window.marketData.length === 0) return;
        const lastItem = window.marketData[window.marketData.length - 1];
        if (!lastItem || !lastItem.date || !lastItem.date.includes("-")) return;
        const parts = lastItem.date.split('-');
        const currY = parseInt(parts[0]), currM = parseInt(parts[1]), currD = parseInt(parts[2]);
        const currNum = currM * 100 + currD;
        const specialDays = ["03-21", "05-15", "06-21", "07-23", "09-21", "11-15", "12-21"];
        let nextGann = null;
        for (let md of specialDays) {
            const gm = parseInt(md.split('-')[0]), gd = parseInt(md.split('-')[1]);
            if (gm * 100 + gd > currNum) { nextGann = `${currY}-${md}`; break; }
        }
        if (!nextGann) nextGann = `${currY + 1}-${specialDays[0]}`;
        const displayEl = document.getElementById('nextGannDisplay');
        if (displayEl) displayEl.innerHTML = `🌌 下個江恩窗口: <span style="color:#e2e8f0;">${nextGann}</span>`;
    }

    function formatToShortDate(dateStr) {
        if (dateStr && dateStr.includes("-") && dateStr.split("-").length === 3) {
            const parts = dateStr.split("-");
            return `${parts[1]}-${parts[2]}`;
        }
        return dateStr;
    }

    async function loadCloudData() {
        showLoading(true);
        const backupTimeout = setTimeout(() => {
            if (window.marketData.length === 0) {
                window.marketData = [...defaultData];
                renderTable();
                initChart();
                showLoading(false);
            }
        }, 3000);
        try {
            const docSnap = await docRef.get();
            clearTimeout(backupTimeout);
            if (docSnap.exists && docSnap.data().list && docSnap.data().list.length > 0) {
                window.marketData = docSnap.data().list;
            } else {
                window.marketData = [...defaultData];
                await docRef.set({ list: window.marketData });
            }
            renderTable();
            initChart();
            showLoading(false);
        } catch (error) {
            console.log("雲端連線異常，使用本地預設：" + error.message);
            clearTimeout(backupTimeout);
            window.marketData = [...defaultData];
            renderTable();
            initChart();
            showLoading(false);
        }
    }

    window.toggleTableDisplay = function() {
        window.isTableExpanded = !window.isTableExpanded;
        const btn = document.getElementById('toggleTableBtn');
        if (window.isTableExpanded) {
            btn.innerHTML = "🔼 收起歷史數據 (僅顯示近 5 日)";
            btn.style.backgroundColor = "#2d3748";
        } else {
            btn.innerHTML = "🔽 展開全部歷史數據";
            btn.style.backgroundColor = "#4a5568";
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (!window.marketData) return;
        const totalRows = window.marketData.length;
        const displayLimit = 5;
        window.marketData.forEach((item, index) => {
            if (!window.isTableExpanded && index < totalRows - displayLimit) return;
            const row = document.createElement('tr');
            const status = window.getMarketStatus(index);
            row.innerHTML = `
                <td>
                    <div class="date-cell-container">
                        <span>${escapeHtml(item.date)}</span>
                        <span id="badge-container-${index}">${status.badgeHTML}</span>
                    </div>
                </td>
                <td>${(item.hsi || 0).toLocaleString()}</td>

    // ===== 散戶行為指數 (Retail Behavior Index, RBI) =====
    // 公式: 街貨相對變化率 = Δ街貨 / 街貨_yest * 100%
    // 街貨: 近價 1000 點內 (bull_1000 / bear_1000)
    // Δ: 今日 - 昨日
    //
    // 方向性解讀 (跟 HSI 方向對比):
    //   順勢 (健康)    : HSI 漲+牛加, HSI 跌+牛減, HSI 漲+熊減, HSI 跌+熊加
    //   逆勢加碼 (警)  : HSI 跌+牛加 (接刀), HSI 漲+熊加 (接空)
    //   逆勢減碼 (中性): HSI 漲+牛減 (獲利), HSI 跌+熊減 (止損)
    //
    // 顏色映射:
    //   順勢 → 綠 (健康)
    //   逆勢加碼 → 紅 (警)
    //   逆勢減碼 → 黃 (中性, 散戶認賠)
    //   平盤 → 灰
    //
    // 門檻: |ΔHSI| < 30 點視為「平盤」, RBI 設 0, 標記 flat:true
    const HSI_FLAT_THRESHOLD = 30;
    function classifyDirection(dHsi, dChg, certType) {
        // certType: 'bull' 或 'bear'
        // 牛: 漲+加 = 順勢, 漲+減 = 逆勢減碼, 跌+加 = 逆勢加碼, 跌+減 = 順勢
        // 熊: 反向 (熊對 HSI 跌有利)
        if (certType === 'bull') {
            if (dHsi > 0 && dChg > 0) return 'trend';          // 漲+加 (健康)
            if (dHsi < 0 && dChg < 0) return 'trend';          // 跌+減 (恐慌止損, 健康)
            if (dHsi < 0 && dChg > 0) return 'counter_add';    // 跌+加 (接刀, 警)
            if (dHsi > 0 && dChg < 0) return 'counter_exit';   // 漲+減 (獲利了結, 中性)
        } else {  // bear
            if (dHsi < 0 && dChg > 0) return 'trend';          // 跌+加 (健康)
            if (dHsi > 0 && dChg < 0) return 'trend';          // 漲+減 (健康)
            if (dHsi > 0 && dChg > 0) return 'counter_add';    // 漲+加 (接空, 警)
            if (dHsi < 0 && dChg < 0) return 'counter_exit';   // 跌+減 (止損, 中性)
        }
        return 'neutral';
    }
    function dirLabel(dir, certType) {
        const m = {
            'trend': '順勢',
            'counter_add': '⚠️逆勢加碼',
            'counter_exit': '逆勢減碼',
            'neutral': '中性',
        };
        return m[dir] || '中性';
    }
    function computeDivergenceRates(data) {
        const rates = [];
        for (let i = 0; i < data.length; i++) {
            if (i === 0 || !data[i-1] || !data[i]) {
                rates.push({ bull: null, bear: null, hsi_change: null, bull_chg: null, bear_chg: null, flat: false, bull_dir: 'neutral', bear_dir: 'neutral' });
                continue;
            }
            const today = data[i];
            const yest = data[i-1];
            const dHsi = (today.hsi || 0) - (yest.hsi || 0);
            const bull_today = today.bull_1000_amount || 0;
            const bear_today = today.bear_1000_amount || 0;
            const bull_yest = yest.bull_1000_amount || 0;
            const bear_yest = yest.bear_1000_amount || 0;
            const dBull = bull_today - bull_yest;
            const dBear = bear_today - bear_yest;
            const flat = Math.abs(dHsi) < HSI_FLAT_THRESHOLD;
            if (dHsi === 0 || flat || bull_yest === 0 || bear_yest === 0) {
                // 平盤日: 數值 = 0 (副圖畫到基準線), 標記 flat
                rates.push({
                    bull: 0, bear: 0,
                    hsi_change: dHsi, bull_chg: dBull, bear_chg: dBear,
                    flat, bull_dir: 'neutral', bear_dir: 'neutral',
                });
            } else {
                // 公式: 相對變化率 = Δ / 昨日街貨 * 100%
                const bullPct = (dBull / bull_yest) * 100;
                const bearPct = (dBear / bear_yest) * 100;
                rates.push({
                    bull: bullPct,
                    bear: bearPct,
                    hsi_change: dHsi,
                    bull_chg: dBull,
                    bear_chg: dBear,
                    flat: false,
                    bull_dir: classifyDirection(dHsi, dBull, 'bull'),
                    bear_dir: classifyDirection(dHsi, dBear, 'bear'),
                });
            }
        }
        return rates;
    }

    // 偵測「連續 N 天逆勢加碼」(方向性)
    // counter_add: 散戶在 HSI 反方向加碼 (警)
    function detectCounterAddStreak(rates, key) {
        // key: 'bull_dir' 或 'bear_dir'
        let streak = 0;
        for (let i = rates.length - 1; i >= 0; i--) {
            const rate = rates[i];
            if (!rate) break;
            if (rate.flat) break;  // 平盤日 break
            if (rate[key] === 'counter_add') {
                streak++;
            } else {
                break;
            }
        }
        return streak;
    }

    // 顏色: 根據方向 (順勢綠, 逆勢加碼紅, 逆勢減碼黃, 平盤灰)
    function dirColor(dir, value) {
        if (value == null) return 'rgba(160, 174, 192, 0.3)';
        const abs = Math.abs(value);
        // 透明度按絕對值: < 5% 淡, 5-15% 中, > 15% 深
        const alpha = abs < 5 ? 0.4 : abs < 15 ? 0.7 : 1.0;
        switch (dir) {
            case 'trend':        return `rgba(72, 187, 120, ${alpha})`;   // 綠 (健康)
            case 'counter_add':  return `rgba(252, 129, 129, ${alpha})`; // 紅 (警)
            case 'counter_exit': return `rgba(237, 187, 49, ${alpha})`;  // 黃 (中性)
            default:             return 'rgba(160, 174, 192, 0.6)';      // 灰
        }
    }
    function dirBorderColor(dir) {
        switch (dir) {
            case 'trend':        return '#48bb78';
            case 'counter_add':  return '#fc8181';
            case 'counter_exit': return '#edbb31';
            default:             return '#a0aec0';
        }
    }

    // 更新背馳率副圖 + 徽章
    function updateDivergenceDisplay(globalIndices) {
        if (!window.divergenceChartInstance || !window.divergenceRates) return;
        window._lastGlobalIndices = globalIndices;
        const slicedRates = globalIndices.map(i => window.divergenceRates[i]);
        const slicedLabels = globalIndices.map(i => {
            const item = window.marketData[i];
            return item ? formatToShortDate(item.date) : '';
        });
        window.divergenceChartInstance.data.labels = slicedLabels;
        // flat 日用 0 顯示 (畫到基準線, 不留空隙)
        window.divergenceChartInstance.data.datasets[0].data = slicedRates.map(r => (r && r.bull !== undefined) ? r.bull : null);
        window.divergenceChartInstance.data.datasets[1].data = slicedRates.map(r => (r && r.bear !== undefined) ? r.bear : null);
        window.divergenceChartInstance.update();

        // 徽章: 用最後一天
        const lastRate = window.divergenceRates[window.divergenceRates.length - 1];
        const lastItem = window.marketData[window.marketData.length - 1];
        const bullBadge = document.getElementById('bullDivBadge');

        const hsiBadge = document.getElementById('hsiChgBadge');
        const expandingBadge = document.getElementById('expandingBadge');

        if (lastRate && lastItem) {

            if (lastRate.flat) {

                bullBadge.style.background = '#718096';

                const arrow = dir === 'counter_add' ? '⚠️' : dir === 'trend' ? '✓' : '↔';

                bullBadge.style.background = dirColor(dir, v);
                bullBadge.style.color = v !== 0 ? 'white' : '#1a202c';
            } else {
                bullBadge.innerHTML = `🐂 牛證: <strong>--</strong>`;
            }
            // 熊證 RBI
            if (lastRate.flat) {
                bearBadge.innerHTML = `🐻 熊證: <strong>平盤</strong>`;
                bearBadge.style.background = '#718096';
                bearBadge.style.color = 'white';

                const sign = v > 0 ? '+' : '';

            } else {
                bearBadge.innerHTML = `🐻 熊證: <strong>--</strong>`;
            }
            // HSI 日變
            if (lastRate.hsi_change != null && lastRate.hsi_change !== 0) {
                const v = lastRate.hsi_change;
                const sign = v > 0 ? '+' : '';
                hsiBadge.innerHTML = `📉 HSI 日變: <strong>${sign}${v.toFixed(0)}</strong>`;
                hsiBadge.style.background = v < 0 ? 'rgba(252, 129, 129, 0.5)' : 'rgba(72, 187, 120, 0.5)';
                hsiBadge.style.color = 'white';

            // 連續 3 天逆勢加碼警示

                                if (item.bull >= 70) notes.push("🔥 牛證過熱 (極端危險)");
                                if (item.bull <= 30) notes.push("❄️ 熊證過剩 (留意誘多)");
                                if (typeof item.bull_amount === 'number') notes.push(`🐂 牛證張數: ${item.bull_amount.toLocaleString()}`);
                                if (typeof item.bear_amount === 'number') notes.push(`🐻 熊證張數: ${item.bear_amount.toLocaleString()}`);
                                if (typeof item.bull_500_amount === 'number') notes.push(`🎯 500點內重貨牛證: ${item.bull_500_amount.toLocaleString()} 張`);
                                if (typeof item.bear_500_amount === 'number') notes.push(`🐻 500點內重貨熊證: ${item.bear_500_amount.toLocaleString()} 張`);
                                return notes.join('\n');
                            }
                        }
                    }
                }
            },
            plugins: [darkBackgroundPlugin, backColorPlugin, {
                id: 'chartStylePlugin',
                beforeDraw: (chart) => {
                    const datasets = chart.data.datasets; const ctx = chart.ctx; ctx.save();
                    ctx.font = '14px "apple color emoji", "segoe ui emoji", "segoe ui symbol", "noto color emoji"';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    datasets.forEach((dataset, datasetIndex) => {
                        const meta = chart.getDatasetMeta(datasetIndex);
                        if (dataset.pointStyle && typeof dataset.pointStyle === 'function') {
                            dataset.data.forEach((value, index) => {
                                const point = meta.data[index];
                                if (point) {
                                    const yPos = chart.scales.yAxisRatio.getPixelForValue(value);
                                    const emoji = dataset.pointStyle({ dataIndex: index });
                                    if (emoji && !isNaN(point.x) && !isNaN(yPos)) {
                                        const emojiYPos = emoji === '🌌' ? yPos + 18 : yPos - 14;
                                        ctx.fillText(emoji, point.x, emojiYPos);
                                    }
                                }
                            });
                        }
                    });
                    ctx.restore();
                }
            }]
        });
        updateChartDirectly();
    }

    function showLoading(show) { const mask = document.getElementById('loadingMask'); if (mask) mask.style.display = show ? 'flex' : 'none'; }
    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) : ''; }

    window.updateDayRange = function(value) {
        const num = parseInt(value);
        window.displayDays = num;
        const label = document.getElementById('dayRangeLabel');
        if (label) label.innerText = num >= 999 ? '全部' : num;
        updateChartDirectly();
    };

    window.addEventListener('DOMContentLoaded', () => {
        loadCloudData().then(() => {
            const slider = document.getElementById('dayRangeSlider');
            const label = document.getElementById('dayRangeLabel');
            if (slider && window.marketData.length > 0) {
                slider.max = Math.max(window.marketData.length, 30);
                // 預設顯示最近 30 天,但不超過資料總筆數
                slider.value = Math.min(window.marketData.length, 30);
                window.displayDays = parseInt(slider.value);
                if (label) label.innerText = window.displayDays >= 999 ? '全部' : window.displayDays;
            }
            // 計算背馳率 + 初始化副圖
            window.divergenceRates = computeDivergenceRates(window.marketData);
            if (!window.divergenceChartInstance) initDivergenceChart();
            // 主動渲染副圖一次 (避免用戶拉 slider 才看到資料)
            if (window.divergenceChartInstance && window.marketData.length > 0) {
                const totalLen = window.marketData.length;
                const showCount = Math.min(window.displayDays || 30, totalLen);
                const globalIndices = [];
                for (let i = totalLen - showCount; i < totalLen; i++) globalIndices.push(i);
                updateDivergenceDisplay(globalIndices);
            }
            // 順便載入期權 OI 資料
            loadOptionsData();
        });
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadCloudData().then(() => {
                window.divergenceRates = computeDivergenceRates(window.marketData);
                // 主動渲染副圖
                if (window.divergenceChartInstance && window.marketData.length > 0) {
                    const totalLen = window.marketData.length;
                    const showCount = Math.min(window.displayDays || 30, totalLen);
                    const globalIndices = [];
                    for (let i = totalLen - showCount; i < totalLen; i++) globalIndices.push(i);
                    updateDivergenceDisplay(globalIndices);
                }
            });
            loadOptionsData();
        });
        document.getElementById('toggleTableBtn').addEventListener('click', window.toggleTableDisplay);
    });

    // ===== HSI 期權 OI 牆位 =====
    const oiDocRef = db.collection("market").doc("hsi_options_oi");

    async function loadOptionsData() {
        try {
            const docSnap = await oiDocRef.get();
            if (!docSnap.exists) {
                document.getElementById('oiUpdateTime').innerText = '尚無資料';
                return;
            }
            const data = docSnap.data();
            const list = data.list || [];
            if (list.length === 0) {
                document.getElementById('oiUpdateTime').innerText = '尚無資料';
                return;
            }
            // 取最新一筆
            const latest = list[list.length - 1];
            renderOptionsOI(latest);
        } catch (e) {
            console.log("期權 OI 載入失敗:", e.message);
            document.getElementById('oiUpdateTime').innerText = '載入失敗';
        }
    }

    function oiFlagsHTML(flags) {
        if (!flags || !flags.length) return '';
        return flags.map(f => {
            if (f === '重貨區') return '<span class="oi-flag oi-flag-heavy">重貨區</span>';
            if (f === '最多新增') return '<span class="oi-flag oi-flag-most">最多新增</span>';
            return '';
        }).join('');
    }

    function renderOptionsOI(data) {
        const strikes = data.strikes || [];
        const callPct = data.call_pct || 0;
        const putPct = data.put_pct || 0;
        const lastClose = data.last_close || 0;
        const updateTime = data.update_time || '--';
        const edgeWarning = data.edge_warning || '';
        const stepUsed = data.step_used || 0;
        const dataFresh = data.data_fresh !== false;  // default true
        const sourceLabel = data._source || '?';

        const timeEl = document.getElementById('oiUpdateTime');
        timeEl.innerText = `更新: ${updateTime} | 收市: ${lastClose.toLocaleString()}`;
        if (!dataFresh) {
            timeEl.style.color = '#f6ad55';
            timeEl.title = `資料源: ${sourceLabel} (昨日回退,今日主源 + 後備皆不可用)`;
        } else {
            timeEl.style.color = '';
            timeEl.title = `資料源: ${sourceLabel}`;
        }
        document.getElementById('oiLastClose').innerText = lastClose.toLocaleString();
        document.getElementById('oiCallPct').innerText = `${callPct.toFixed(1)}%`;
        document.getElementById('oiPutPct').innerText = `${putPct.toFixed(1)}%`;
        document.getElementById('oiCallBar').style.width = `${callPct}%`;
        document.getElementById('oiPutBar').style.width = `${putPct}%`;
        document.getElementById('oiStrikeCount').innerText =
            stepUsed > 0 ? `(${strikes.length} 個 strike, step=${stepUsed})` : '';

        // Edge warning
        const warnEl = document.getElementById('oiEdgeWarning');
        if (warnEl) {
            if (edgeWarning) {
                warnEl.innerText = edgeWarning;
                warnEl.style.display = 'block';
            } else {
                warnEl.style.display = 'none';
            }
        }

        if (strikes.length === 0) {
            document.getElementById('oiTableBody').innerHTML =
                '<tr><td colspan="5" style="padding: 20px; color: #a0aec0;">尚無 strike 資料</td></tr>';
            return;
        }

        // 取最大 OI 作為 bar 寬度基準
        const maxCallOI = Math.max(...strikes.map(s => s.call_oi || 0), 1);
        const maxPutOI = Math.max(...strikes.map(s => s.put_oi || 0), 1);
        const maxOI = Math.max(maxCallOI, maxPutOI);

        // Smart window: 預設顯示 HSI ±1500 (約 15 個 strike),展開才顯示全部
        const DEFAULT_WINDOW = 1500;
        window._oiSmartWindow = DEFAULT_WINDOW;
        window._oiExpanded = false;
        const toggleBtn = document.getElementById('oiToggleBtn');
        if (toggleBtn) {
            toggleBtn.style.display = strikes.length > 20 ? 'inline-block' : 'none';
            toggleBtn.innerText = '📖 展開全部';
            toggleBtn.onclick = () => {
                window._oiExpanded = !window._oiExpanded;
                toggleBtn.innerText = window._oiExpanded ? '📕 收起重點視窗 (±1500)' : '📖 展開全部';
                applySmartWindow();
            };
        }

        const tbody = document.getElementById('oiTableBody');
        tbody.innerHTML = '';
        strikes.forEach((s, idx) => {
            const isHeavy = ((s.call_flags || []).includes('重貨區')) ||
                            ((s.put_flags || []).includes('重貨區'));
            const isNear = !!s.is_near_money;
            const row = document.createElement('tr');
            let cls = '';
            if (isHeavy) cls += 'oi-row-heavy ';
            if (isNear) cls += 'oi-row-near ';
            row.className = cls.trim();
            row.dataset.idx = idx;
            row.dataset.rel = s.relative_position != null ? s.relative_position : (s.strike - lastClose);

            const callWidth = ((s.call_oi || 0) / maxOI * 100).toFixed(1);
            const putWidth = ((s.put_oi || 0) / maxOI * 100).toFixed(1);
            const callChg = s.call_oi_change;
            const putChg = s.put_oi_change;
            const callChgText = (callChg > 0 ? '+' : '') + (callChg == null ? '0' : callChg);
            const putChgText = (putChg > 0 ? '+' : '') + (putChg == null ? '0' : putChg);
            const callFlagsHTML = oiFlagsHTML(s.call_flags);
            const putFlagsHTML = oiFlagsHTML(s.put_flags);

            row.innerHTML = `
                <td class="oi-cell-pct">${(s.call_pct || 0).toFixed(2)}%</td>
                <td>
                    <div class="oi-cell-bar-wrap">
                        <div class="oi-cell-bar-call" style="width: ${callWidth}%;"></div>
                        <span class="oi-cell-text-call">${(s.call_oi || 0).toLocaleString()}[${callChgText}] ${callFlagsHTML}</span>
                    </div>
                </td>
                <td class="oi-col-strike">${(s.strike || 0).toLocaleString()}</td>
                <td>
                    <div class="oi-cell-bar-wrap">
                        <div class="oi-cell-bar-put" style="width: ${putWidth}%;"></div>
                        <span class="oi-cell-text-put">${putFlagsHTML}${(s.put_oi || 0).toLocaleString()}[${putChgText}]</span>
                    </div>
                </td>
                <td class="oi-cell-pct">${(s.put_pct || 0).toFixed(2)}%</td>
            `;
            tbody.appendChild(row);
        });

        // 套用 smart window
        function applySmartWindow() {
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(r => {
                const rel = Math.abs(parseInt(r.dataset.rel, 10) || 0);
                if (window._oiExpanded || rel <= window._oiSmartWindow || r.classList.contains('oi-row-near') || r.classList.contains('oi-row-heavy')) {
                    r.classList.remove('oi-row-hidden');
                } else {
                    r.classList.add('oi-row-hidden');
                }
            });
        }
        applySmartWindow();
    }
</script>
